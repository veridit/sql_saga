name: make installcheck
on: [push, pull_request, workflow_dispatch]

# Independent checks run as parallel jobs (hug frb2e9): the regular tests, the same tests on the PL/pgSQL planner, the
# restore round trips in two groups, the candidate's artifact gate, and one upgrade job per released baseline. Every
# job sets up its own disposable PostgreSQL 18 (.github/actions/setup-sql-saga). Benchmarks are not run in CI: shared
# runners are too noisy to compare timings, and they need server settings (devops/benchmark_settings.sh).

env:
  PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          # The generator check reads the released steps from the release tags (chain_steps.py --check).
          fetch-depth: 0
          fetch-tags: true

      - name: Set up PostgreSQL 18 and sql_saga
        uses: ./.github/actions/setup-sql-saga

      - name: Test the update-step generator and the released steps
        run: make test-generator PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Native unit tests
        run: make test-native PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Every C function a shipped script binds to exists
        run: make test-native-symbols PG_CONFIG=${{ env.PG_CONFIG }}

      - name: sql_saga_native must not be an installable extension
        run: |
          test ! -e "$(${{ env.PG_CONFIG }} --sharedir)/extension/sql_saga_native.control"
          test -e "$(${{ env.PG_CONFIG }} --pkglibdir)/sql_saga_native.so"

      - name: Run regression tests (excluding benchmarks)
        run: make test fast PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run isolation tests (temporal_merge under concurrent writers)
        run: make test-isolation PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run concurrent function-attribution isolation test
        run: make test-function-attribution-concurrency PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run regular foreign-key concurrency checks
        # This server was created by this job and is disposable. The harness verifies its exact identity.
        env:
          PGHOST: /var/run/postgresql
          PGPORT: '5432'
        run: |
          export PGUSER="$(whoami)"
          export REGULAR_FK_CONCURRENCY_DATA_DIRECTORY="$(psql -X -v ON_ERROR_STOP=1 -d postgres -Atc 'SHOW data_directory')"
          # The harness resolves this directory with pwd -P. Allow traversal only on this disposable job's cluster.
          sudo setfacl -m "u:$(whoami):x" "$REGULAR_FK_CONCURRENCY_DATA_DIRECTORY"
          make test-regular-fk-concurrency PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Show regression diffs on failure
        if: failure()
        run: |
          if [ -f regression.diffs ]; then cat regression.diffs; fi
          if [ -f isolation/output/regression.diffs ]; then cat isolation/output/regression.diffs; fi

  test-plpgsql:
    # The PL/pgSQL planner is the test oracle: the fast regression tests run on it against the same expected output
    # (make test-plpgsql, native-only tests skipped).
    name: Tests, PL/pgSQL planner
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up PostgreSQL 18 and sql_saga
        uses: ./.github/actions/setup-sql-saga

      - name: Run regression tests on the PL/pgSQL planner (excluding benchmarks and native-only tests)
        run: make test-plpgsql PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Show regression diffs on failure
        if: failure()
        run: if [ -f tmp/plpgsql/regression.diffs ]; then cat tmp/plpgsql/regression.diffs; fi

  restore:
    # Serial, single-transaction and --no-owner restores must succeed with identical ACLs, policies and tenant
    # isolation. Parallel restore is reported as a known PostgreSQL limitation and does not fail the job (see
    # doc/decision-log.md). Two groups: the cases of this build, and dumps made by released builds.
    name: Restore (${{ matrix.cases }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cases: [current, old_dumps]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          # The old-dump cases build released tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up PostgreSQL 18 and sql_saga
        uses: ./.github/actions/setup-sql-saga

      - name: Run pg_dump/pg_restore round trips
        run: make test-restore CASES=${{ matrix.cases }} PG_CONFIG=${{ env.PG_CONFIG }}

  upgrade-artifacts:
    # The candidate's artifact gate (released steps byte-identical, the chain documented) and the extension-script
    # section, once; the upgrade paths run in the matrix below. Also lists the baselines for that matrix, from
    # devops/upgrade_test.sh, so a new release cannot be left out by hand.
    name: Upgrade artifacts
    runs-on: ubuntu-24.04
    outputs:
      baselines: ${{ steps.list.outputs.baselines }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: List the released baselines
        id: list
        run: echo "baselines=$(PG_CONFIG=true UPGRADE_ONLY=list_baselines devops/upgrade_test.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up PostgreSQL 18 and sql_saga
        uses: ./.github/actions/setup-sql-saga

      - name: Candidate artifact gate
        run: UPGRADE_ONLY=artifacts make test-upgrade PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Extension scripts that change managed tables
        run: UPGRADE_ONLY=extension_scripts make test-upgrade PG_CONFIG=${{ env.PG_CONFIG }}

  upgrade:
    # Builds the released tag privately, updates its database through the chain of steps to the candidate and compares
    # with a fresh install, including ACLs and generated objects (devops/upgrade_test.sh), one baseline per job.
    name: Upgrade from ${{ matrix.baseline }}
    needs: upgrade-artifacts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        baseline: ${{ fromJSON(needs.upgrade-artifacts.outputs.baselines) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up PostgreSQL 18 and sql_saga
        uses: ./.github/actions/setup-sql-saga

      - name: Upgrade path from ${{ matrix.baseline }}
        run: UPGRADE_ONLY_BASELINES=${{ matrix.baseline }} make test-upgrade PG_CONFIG=${{ env.PG_CONFIG }}
