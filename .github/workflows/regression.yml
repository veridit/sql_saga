name: make installcheck
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: PostgreSQL 18 + Rust
    runs-on: ubuntu-24.04

    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config

    steps:
      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18 postgresql-contrib-18 libclang-dev build-essential pkg-config python3 acl

      - name: Start PostgreSQL 18
        run: |
          sudo pg_lsclusters -h | awk '{print $1, $2}' | while read ver name; do sudo pg_dropcluster --stop "$ver" "$name" 2>/dev/null || true; done
          sudo pg_createcluster 18 main --start --port 5432
          sudo -u postgres createuser -s $(whoami)

      - name: Add pg_config to PATH
        run: echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH

      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          # The 1.3 upgrade matrix builds released v1.0, v1.1 and v1.2 tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Allow runner to install extensions
        run: sudo chown -R $(whoami) $(${{ env.PG_CONFIG }} --pkglibdir) $(${{ env.PG_CONFIG }} --sharedir)/extension

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Test deterministic update-script generation
        run: |
          make test-generator PG_CONFIG=${{ env.PG_CONFIG }}
          MAKEFLAGS=PG_STAT_MONITOR_AVAILABLE=no devops/test_update_scripts_make.sh

      - name: Build and install sql_saga (C library, internal native library, SQL)
        run: make PG_CONFIG=${{ env.PG_CONFIG }} && make install PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Native unit tests
        run: make test-native PG_CONFIG=${{ env.PG_CONFIG }}

      - name: sql_saga_native must not be an installable extension
        run: |
          test ! -e "$(${{ env.PG_CONFIG }} --sharedir)/extension/sql_saga_native.control"
          test -e "$(${{ env.PG_CONFIG }} --pkglibdir)/sql_saga_native.so"

      - name: Run regression tests (excluding benchmarks)
        run: make test fast PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run pg_dump/pg_restore round trips
        # Serial, single-transaction and --no-owner restores must succeed with identical ACLs,
        # policies and tenant isolation. Parallel restore is reported as a known PostgreSQL
        # limitation and does not fail the job (see doc/decision-log.md).
        run: make test-restore PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run released 1.0, 1.1 and 1.2 to 1.3 upgrade matrix
        # Builds all three release tags privately, upgrades each directly to candidate 1.3 and compares
        # with a fresh 1.3 install, including ACLs and generated objects (devops/upgrade_test.sh).
        run: make test-upgrade PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run concurrent function-attribution isolation test
        run: make test-function-attribution-concurrency PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Run regular foreign-key concurrency checks
        # This server was created by this job and is disposable. The harness verifies its exact identity.
        env:
          PGHOST: /var/run/postgresql
          PGPORT: '5432'
        run: |
          export PGUSER="$(whoami)"
          export REGULAR_FK_CONCURRENCY_DATA_DIRECTORY="$(psql -X -v ON_ERROR_STOP=1 -d postgres -Atc 'SHOW data_directory')"
          # The harness resolves this directory with pwd -P. Allow traversal only on this disposable job's cluster.
          sudo setfacl -m "u:$(whoami):x" "$REGULAR_FK_CONCURRENCY_DATA_DIRECTORY"
          make test-regular-fk-concurrency PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Show regression diffs on failure
        if: failure()
        run: |
          if [ -f regression.diffs ]; then cat regression.diffs; fi
