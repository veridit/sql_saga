[package]
name = "sql_saga_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]

[dependencies]
pgrx = "=0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.dev]
panic = "unwind"
opt-level = 2

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
