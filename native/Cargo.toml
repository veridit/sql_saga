[package]
name = "sql_saga_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]

[dependencies]
pgrx = "=0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.dev]
panic = "unwind"
opt-level = 2

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
# Before Rust 1.98, cargo's default debuginfo strip (rust-objcopy) leaves the Mach-O string pool 4-byte aligned, and
# macOS 27's dyld refuses such a library ("mis-aligned LINKEDIT string pool", rust-lang/rust#157750). Unstripped costs
# about 44 KB.
strip = "none"
